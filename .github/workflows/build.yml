name: build

# 在 macOS（Universal）与 Windows 上自动构建安装包。
# OCR / 增强脱敏模型已随仓库提交；pdfium 二进制不提交，构建前自动下载。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-14
            target: universal-apple-darwin
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - name: Windows x64
            platform: windows-latest
            target: ""
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/*.exe
              release/*.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 下载 pdfium（macOS）
        if: runner.os == 'macOS'
        run: ./scripts/fetch_pdfium.sh

      - name: 下载 pdfium（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch_pdfium.ps1

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 构建安装包（macOS）
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: 构建安装包（Windows）
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: 生成 Windows 标准包与完整离线包
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: luminar-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: warn
