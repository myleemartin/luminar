name: release

# 推送 v* 标签时构建 macOS（arm64/x64）与 Windows 安装包，并创建 GitHub Release 草稿。
# 安装包内置 pdfium 与 OCR 模型，用户下载后无需再单独安装。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            artifact: luminar-macos-universal
          - platform: windows-latest
            target: ""
            artifact: luminar-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: 下载 pdfium（macOS）
        if: runner.os == 'macOS'
        run: ./scripts/fetch_pdfium.sh

      - name: 下载 pdfium（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch_pdfium.ps1

      - name: 下载 OCR 模型并随安装包内置
        shell: bash
        run: ./scripts/fetch_ocr_models.sh src-tauri/resources/models

      - name: 前端构建
        run: npm run build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: 生成 Windows 标准包与完整离线包
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.zip
          if-no-files-found: warn

  publish:
    name: 创建 Release 草稿
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
